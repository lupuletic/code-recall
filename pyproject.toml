[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-recall"
version = "0.2.3"
description = "Semantic search across local coding-agent sessions. Find past conversations by intent, not just keywords."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Catalin Lupuleti" }]
keywords = ["coding-agent", "codex", "session", "search", "semantic", "recall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]

[project.scripts]
code-recall = "code_recall.cli:main"

[project.optional-dependencies]
semantic = ["fastembed>=0.4", "sqlite-vec>=0.1"]
tui = ["textual>=1.0"]
all = ["code-recall[semantic,tui]"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/lupuletic/code-recall"
Repository = "https://github.com/lupuletic/code-recall"
Issues = "https://github.com/lupuletic/code-recall/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/code_recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
